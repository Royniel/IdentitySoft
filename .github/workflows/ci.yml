name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identitysoft
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs the full suite, including the Testcontainers-backed integration tests —
      # ubuntu-latest ships Docker preinstalled, so no extra setup is needed here.
      - name: Run tests
        run: ./mvnw test -B

  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Build only — never pushed anywhere.
      - name: Build backend image
        run: docker build -t identitysoft-backend:ci ./identitysoft
