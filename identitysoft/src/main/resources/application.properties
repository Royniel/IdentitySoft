# ===== Application =====
spring.application.name=identitysoft

# ===== PostgreSQL Connection =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
spring.datasource.username=${DB_USERNAME:identity_user}
spring.datasource.password=${DB_PASSWORD:identity_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== Server =====
server.port=8080

# ===== JWT (override JWT_SECRET in production — this default is a demo-only value) =====
app.jwt.secret=${JWT_SECRET:ThisIsADemoSecretKeyReplaceItWithSomethingLongerInProduction12345}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Seed admin (created on startup only if the users table is empty) =====
app.seed-admin.username=${SEED_ADMIN_USERNAME:Nilanjan}
app.seed-admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:Admin@123}

# ===== Actuator (container healthcheck) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ===== Logging =====
logging.file.name=logs/app.log
logging.level.org.springframework.security=DEBUG
logging.level.com.identity.identitysoft=DEBUG