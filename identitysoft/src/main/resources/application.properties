# ===== Application =====
spring.application.name=identitysoft

# ===== PostgreSQL Connection =====
spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db
spring.datasource.username=identity_user
spring.datasource.password=identity_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== Server =====
server.port=8080

# ===== JWT  =====
app.jwt.secret=ThisIsADemoSecretKeyReplaceItWithSomethingLongerInProduction12345
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===== Logging =====
logging.file.name=logs/app.log
logging.level.org.springframework.security=DEBUG
logging.level.com.identity.identitysoft=DEBUG